<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetPilot</title>
<meta name="description" content="Run every Linux host in your datacenter from one place.">
<!-- blueprint:head -->
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='3' y='8' width='26' height='16' rx='3' fill='%2317253A'/%3E%3Crect x='7' y='12' width='18' height='3' rx='1' fill='%232F6FDB'/%3E%3Crect x='7' y='17' width='18' height='3' rx='1' fill='%231F9D68'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/cantarell.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/lib/auth.css">
<link rel="stylesheet" href="css/lib/audit.css">
<link rel="stylesheet" href="css/lib/stats.css">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=JSON.parse(localStorage.getItem('fleetpilot.v1')||'{}').prefs;if(t&&t.theme)document.documentElement.dataset.theme=t.theme}catch(e){}</script>
<!-- /blueprint:head -->
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main navigation">
<!-- blueprint:logo -->
    <a class="logo" href="#/" title="FleetPilot" aria-label="FleetPilot home">
      <svg viewBox="0 0 32 32" width="36" height="36" aria-hidden="true"><rect x="3" y="8" width="26" height="16" rx="3" fill="var(--ink)"/><rect x="7" y="12" width="18" height="3" rx="1" fill="var(--c-blue)"/><rect x="7" y="17" width="18" height="3" rx="1" fill="var(--c-green)"/></svg>
    </a>
<!-- /blueprint:logo -->
    <a href="#/" data-nav="home"><span data-icon="course"></span>Home</a>
    <a href="#/work" data-nav="work"><span data-icon="lab"></span>Work</a>
    <a href="#/library" data-nav="library"><span data-icon="nets"></span>Library</a>
    <a href="#/parts" data-nav="parts"><span data-icon="sliders"></span>Parts</a>
    <span class="spacer"></span>
    <button id="theme" type="button" title="Light or dark"></button>
  </nav>
  <main class="main"></main>
</div>
<noscript><p style="padding:2rem">FleetPilot requires JavaScript.</p></noscript>
<script type="module">
  import { I } from './js/icons.js';
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = I[e.dataset.icon]);
  import('./js/app.js');
</script>
</body>
</html>
