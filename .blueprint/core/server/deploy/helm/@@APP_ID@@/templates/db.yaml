{{- if .Values.database.bundled.enabled }}
# The bundled PostgreSQL: one pod, data on a persistent volume that outlives the release
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "@@APP_ID@@.fullname" . }}-db
  labels:
    {{- include "@@APP_ID@@.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "@@APP_ID@@.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "@@APP_ID@@.dbSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "@@APP_ID@@.dbSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.database.bundled.image }}
          env:
            - name: POSTGRES_DB
              value: @@APP_ID@@
            - name: POSTGRES_USER
              value: @@APP_ID@@
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "@@APP_ID@@.dbSecret" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "@@APP_ID@@", "-d", "@@APP_ID@@"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.database.bundled.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.database.bundled.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.bundled.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "@@APP_ID@@.fullname" . }}-db
  labels:
    {{- include "@@APP_ID@@.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  selector:
    {{- include "@@APP_ID@@.dbSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
