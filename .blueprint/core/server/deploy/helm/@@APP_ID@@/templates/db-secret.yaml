{{- if not .Values.database.existingSecret }}
{{- $pw := include "@@APP_ID@@.dbPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "@@APP_ID@@.fullname" . }}-db
  labels:
    {{- include "@@APP_ID@@.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm uninstall: it holds the database password
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.database.bundled.enabled }}
  password: {{ $pw | quote }}
  url: {{ printf "postgres://@@APP_ID@@:%s@%s-db:5432/@@APP_ID@@" $pw (include "@@APP_ID@@.fullname" .) | quote }}
  {{- else }}
  url: {{ required "database.url or database.existingSecret is needed when database.bundled.enabled is false" .Values.database.url | quote }}
  {{- end }}
{{- end }}
