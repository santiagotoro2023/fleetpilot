# @@APP_NAME@@ in a container. TLS is done by whatever sits in front (Ingress, Caddy,
# Traefik, a load balancer), the container itself speaks plain HTTP on port 8080.
server {
    # listen 8080, and [::]:8080 where the system has IPv6 (written at start)
    include /tmp/@@APP_ID@@/listen.conf;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'" always;

    # For liveness and readiness probes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # Written at start from the environment (see 40-@@APP_ID@@-site.sh)
    location = /site.json {
        alias /tmp/@@APP_ID@@/site.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    # The files have no hash in their names: browsers check for a new version every time
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'" always;
    }
}
