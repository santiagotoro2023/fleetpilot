apiVersion: v1
kind: Service
metadata:
  name: {{ include "@@APP_ID@@.fullname" . }}
  labels:
    {{- include "@@APP_ID@@.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and .Values.service.nodePort (eq .Values.service.type "NodePort") }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "@@APP_ID@@.selectorLabels" . | nindent 4 }}
