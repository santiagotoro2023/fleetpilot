@@IF lib:secrets@@
{{- if not .Values.secretKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "@@APP_ID@@.fullname" . }}-key
  labels:
    {{- include "@@APP_ID@@.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm uninstall: it holds the key for the stored secrets
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  key: {{ include "@@APP_ID@@.keyValue" . | quote }}
{{- end }}
@@END@@
