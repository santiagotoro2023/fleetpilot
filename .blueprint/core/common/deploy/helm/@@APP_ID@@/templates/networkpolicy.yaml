{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "@@APP_ID@@.fullname" . }}
  labels:
    {{- include "@@APP_ID@@.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "@@APP_ID@@.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - port: http
@@IF static@@
  # The pods never connect anywhere: nginx only answers
  egress: []
@@END@@
@@IF server@@
  # The app only talks to PostgreSQL and to DNS
  egress:
    - ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
@@END@@
{{- end }}
