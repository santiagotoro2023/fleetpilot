# @@APP_NAME@@ on Kubernetes without Helm: one file, apply and go.
#
#   kubectl apply -f deploy/kubernetes/@@APP_ID@@.yaml
#   kubectl -n @@APP_ID@@ port-forward svc/@@APP_ID@@ 8080:80     # try it: http://localhost:8080
#
# Before you use the Ingress at the end: set your host name (two places) and the
# ingressClassName of your cluster. @@APP_ENV@@_CANONICAL should be the same address.
@@IF static@@
# The app is stateless (data lives in the users' browsers): no volume needed.
@@END@@
@@IF server@@
# All data lives in PostgreSQL: a small database (one pod with a volume) is part of this
# file. Set a password in the Secret first. With a database of your own, delete the
# StatefulSet and Service "db" and put its address into the Secret.
@@END@@
apiVersion: v1
kind: Namespace
metadata:
  name: @@APP_ID@@
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
@@IF server@@
apiVersion: v1
kind: Secret
metadata:
  name: @@APP_ID@@-db
  namespace: @@APP_ID@@
type: Opaque
stringData:
  # Change the password in both lines before the first apply
  password: change-me
  url: postgres://@@APP_ID@@:change-me@db:5432/@@APP_ID@@
---
@@IF lib:secrets@@
apiVersion: v1
kind: Secret
metadata:
  name: @@APP_ID@@-key
  namespace: @@APP_ID@@
type: Opaque
stringData:
  # The key that encrypts the stored secrets: put in a new one before the first apply
  # (openssl rand -base64 32), back it up, and never change it afterwards
  key: ""
---
@@END@@
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: @@APP_ID@@
  labels:
    app.kubernetes.io/name: @@APP_ID@@-db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: @@APP_ID@@-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: @@APP_ID@@-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: @@APP_ID@@
            - name: POSTGRES_USER
              value: @@APP_ID@@
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: @@APP_ID@@-db, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "@@APP_ID@@", "-d", "@@APP_ID@@"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: @@APP_ID@@
spec:
  selector:
    app.kubernetes.io/name: @@APP_ID@@-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
@@END@@
apiVersion: apps/v1
kind: Deployment
metadata:
  name: @@APP_ID@@
  namespace: @@APP_ID@@
  labels:
    app.kubernetes.io/name: @@APP_ID@@
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: @@APP_ID@@
  template:
    metadata:
      labels:
        app.kubernetes.io/name: @@APP_ID@@
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
@@IF static@@
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
@@END@@
@@IF server@@
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
@@END@@
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: @@APP_ID@@
          image: ghcr.io/@@APP_OWNER_LC@@/@@APP_ID@@:@@VERSION@@
          imagePullPolicy: IfNotPresent
          env:
            - name: @@APP_ENV@@_CANONICAL
              value: "https://@@APP_ID@@.example.com"
@@IF server@@
            - name: @@APP_ENV@@_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: @@APP_ID@@-db, key: url }
@@END@@
@@IF lib:secrets@@
            - name: @@APP_ENV@@_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: @@APP_ID@@-key, key: key }
@@END@@
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
@@IF static@@
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
@@END@@
@@IF server@@
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 384Mi
@@END@@
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      # One replica per node on a three node cluster
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: @@APP_ID@@
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: @@APP_ID@@
  namespace: @@APP_ID@@
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: @@APP_ID@@
---
apiVersion: v1
kind: Service
metadata:
  name: @@APP_ID@@
  namespace: @@APP_ID@@
  labels:
    app.kubernetes.io/name: @@APP_ID@@
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: @@APP_ID@@
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: @@APP_ID@@
  namespace: @@APP_ID@@
  annotations:
    # With cert-manager for a Let's Encrypt certificate (remove if you have none):
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx            # traefik on k3s
  tls:
    - hosts: [@@APP_ID@@.example.com]
      secretName: @@APP_ID@@-tls
  rules:
    - host: @@APP_ID@@.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: @@APP_ID@@
                port:
                  name: http
