<!--
  Logo template of the design system (docs/DESIGN.md, "Logo"). Grid: 32 x 32 units.

  FIXED, never change:
    viewBox        0 0 32 32 (the card sits in the middle; the empty space above and below belongs to the logo)
    card           x=3 y=8 width=26 height=16 rx=3
    card color     --ink: #17253A in light mode, #E4EBF5 in dark mode (in the app: fill="var(--ink)")

  YOURS to choose, inside the CONTENT BOX only (x 7 to 25, y 12 to 20, 18 x 8 units, 4 units from every card edge):
    one pattern    bars, steps, rows, split, dots, pair (make-logo.mjs draws them; do not invent new ones)
    1 to 4 colors  from the signal colors, each part its own color, never ink, grey or white
    parts          rx=1 rectangles or circles, flat fill: no strokes, gradients, shadows, text or letters

  In a project: set LOGO_PATTERN and LOGO_COLORS in project.conf, then bash build.sh (SVG)
  and node .blueprint/tools/blueprint.mjs logo (PNG). By hand: .blueprint/tools/make-logo.mjs
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect x="3" y="8" width="26" height="16" rx="3" fill="#17253A"/>
  <!-- content box: replace this dashed outline with the parts of one pattern -->
  <rect x="7" y="12" width="18" height="8" fill="none" stroke="#7A889B" stroke-width=".25" stroke-dasharray=".6 .6"/>
</svg>
