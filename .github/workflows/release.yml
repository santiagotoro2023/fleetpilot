# Blueprint 1.1.0: the same pipeline in every project.
# Every push and pull request: blueprint check, unit and browser tests, Helm chart and
# Kubernetes manifest, Compose, and the installer on Debian 12 and 13 (systemd).
# Pushes to main and tags v* then publish to the GitHub Container Registry:
#   image:  ghcr.io/<owner>/fleetpilot:<version> and :latest
#   chart:  oci://ghcr.io/<owner>/charts/fleetpilot --version <version>
# The version comes from the file VERSION.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  KUBERNETES_VERSION: 1.31.0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FLEETPILOT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: npm ci --no-audit --no-fund
      - name: Blueprint check
        run: node .blueprint/tools/blueprint.mjs check
      - name: Build (every generated file must be committed)
        run: |
          bash build.sh
          git diff --exit-code || { echo "::error::Run build.sh and commit the changes"; exit 1; }
      - name: Unit tests
        run: node test/run.mjs
      - name: Browser for the tests
        timeout-minutes: 10
        # Only the browser: GitHub's Ubuntu runners already have its system libraries. apt
        # (install-deps), whose mirrors can stall, only when Chromium does not start without it.
        run: |
          npx playwright install chromium
          node -e "require('playwright').chromium.launch().then(b => b.close())" || {
            echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-timeouts >/dev/null
            npx playwright install-deps chromium
          }
      - name: Browser tests
        run: node test/run.mjs --browser
      - name: Helm chart and Kubernetes manifest
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          helm lint --strict deploy/helm/fleetpilot
          helm template t deploy/helm/fleetpilot --set ingress.enabled=true --set autoscaling.enabled=true --set networkPolicy.enabled=true \
            | ./kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION"
          ./kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" deploy/kubernetes/fleetpilot.yaml

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up (built from this commit)
        run: |
          docker compose up -d --build --wait
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 2; done
          curl -fsS http://localhost:8080/site.json
          curl -fsS http://localhost:8080/ | grep -q '<nav class="rail"'
          docker compose down -v

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installer
        run: npm ci --no-audit --no-fund && bash build.sh
      - name: The installer of the previous release (to test the update from it)
        run: |
          last="$(git rev-list -n1 HEAD -- VERSION)"
          git show "${last}~1:fleetpilot-install.sh" > /tmp/previous-install.sh 2>/dev/null || rm -f /tmp/previous-install.sh
          [ -s /tmp/previous-install.sh ] && echo "Previous: $(grep -m1 -E '^(APP|PP)_VERSION=' /tmp/previous-install.sh)" || echo "No previous release"
      - name: Install, update and remove on Debian ${{ matrix.debian }}
        run: bash test/installer/run.sh debian:${{ matrix.debian }} /tmp/previous-install.sh

  image:
    if: github.event_name != 'pull_request'
    needs: [test, compose, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fleetpilot
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint, package and push the chart
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          helm lint --strict deploy/helm/fleetpilot
          helm package deploy/helm/fleetpilot --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "fleetpilot-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
