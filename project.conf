# Blueprint settings of this project (see .blueprint/spec/03-repository.md, "project.conf").
# Every blueprint file is rendered from them: change them, then run build.sh.
APP_ID="fleetpilot"
APP_NAME="FleetPilot"
APP_TAGLINE="Run every Linux host in your datacenter from one place."
APP_DESCRIPTION="Inventory, IP address management and intent-based automation with Ansible: take over new hosts, describe their desired state and apply it to the whole fleet."
APP_REPO="santiagotoro2023/fleetpilot"
APP_PROFILE="server"
APP_PORT="8443"
APP_KEYWORDS="automation, ansible, infrastructure, inventory, ipam"
APP_DATA_NOTE="Hosts, templates and runs live in PostgreSQL; stored secrets are encrypted with a key kept apart."
LOGO_PATTERN="rows"
LOGO_COLORS="blue,green"
LIBRARY="auth,audit,jobs,secrets,stats"
APP_PACKAGES="ansible-core openssh-client"
