apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fleetpilot.fullname" . }}-test"
  labels:
    {{- include "fleetpilot.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36
      command: ['sh', '-c', 'wget -qO- http://{{ include "fleetpilot.fullname" . }}:{{ .Values.service.port }}/healthz && wget -qO- http://{{ include "fleetpilot.fullname" . }}:{{ .Values.service.port }}/site.json']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
