{{- if not .Values.secretKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetpilot.fullname" . }}-key
  labels:
    {{- include "fleetpilot.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm uninstall: it holds the key for the stored secrets
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  key: {{ include "fleetpilot.keyValue" . | quote }}
{{- end }}
