{{- if not .Values.database.existingSecret }}
{{- $pw := include "fleetpilot.dbPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetpilot.fullname" . }}-db
  labels:
    {{- include "fleetpilot.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm uninstall: it holds the database password
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.database.bundled.enabled }}
  password: {{ $pw | quote }}
  url: {{ printf "postgres://fleetpilot:%s@%s-db:5432/fleetpilot" $pw (include "fleetpilot.fullname" .) | quote }}
  {{- else }}
  url: {{ required "database.url or database.existingSecret is needed when database.bundled.enabled is false" .Values.database.url | quote }}
  {{- end }}
{{- end }}
